procedures:
  - code: test_sum
    name: Somma di prova
    handler_class: ScriptManager::Command::TestHandler
    execution_mode: sync
    timeout_seconds: 10
    parameter_schema:
      type: object
      required: [a, b]
      properties:
        a: {type: integer, minimum: 0, maximum: 1000}
        b: {type: integer, minimum: 0, maximum: 1000}
  - code: test_fail
    name: Fallimento di prova
    handler_class: ScriptManager::Command::TestHandler
    execution_mode: sync
    timeout_seconds: 10
    parameter_schema:
      properties:
        mode: {type: string, enum: [fail], default: fail}
  - code: test_die
    name: Eccezione di prova
    handler_class: ScriptManager::Command::TestHandler
    execution_mode: sync
    timeout_seconds: 10
    parameter_schema:
      properties:
        mode: {type: string, enum: [die], default: die}
  - code: test_slow
    name: Timeout di prova
    handler_class: ScriptManager::Command::TestHandler
    execution_mode: sync
    timeout_seconds: 1
    parameter_schema:
      properties:
        mode: {type: string, enum: [slow], default: slow}
  - code: test_secret
    name: Parametro sensibile di prova
    handler_class: ScriptManager::Command::TestHandler
    execution_mode: sync
    timeout_seconds: 10
    parameter_schema:
      required: [token]
      properties:
        mode: {type: string, enum: [secret], default: secret}
        token: {type: string, minLength: 1, x-sensitive: true}
  - code: test_async
    name: Esempio asincrono
    handler_class: ScriptManager::Command::Example
    execution_mode: async
    timeout_seconds: 30
    exclusive: true
    parameter_schema:
      required: [message]
      properties:
        message: {type: string, minLength: 1, maxLength: 50}
        repeat: {type: integer, minimum: 1, maximum: 5, default: 2}
        delay_seconds: {type: number, minimum: 0, maximum: 1, default: 0}
        write_file: {type: boolean, default: true}
  - code: test_database_a
    name: Coda database A
    handler_class: ScriptManager::Command::Example
    execution_mode: async
    timeout_seconds: 30
    exclusive: true
    queue_by_database: true
    parameter_schema: &database_schema
      required: [database, message]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
        message: {type: string, minLength: 1}
        repeat: {type: integer, default: 1}
        delay_seconds: {type: number, default: 0}
        write_file: {type: boolean, default: false}
  - code: test_database_b
    name: Coda database B
    handler_class: ScriptManager::Command::Example
    execution_mode: async
    timeout_seconds: 30
    exclusive: true
    queue_by_database: true
    parameter_schema: *database_schema
  - code: test_disabled
    name: Disabilitata
    enabled: false
    handler_class: ScriptManager::Command::TestHandler
    execution_mode: sync
    timeout_seconds: 10
    parameter_schema: {}
  - code: carica_db
    name: 02 test timeout
    handler_class: ScriptManager::Command::Example
    execution_mode: async
    timeout_seconds: 1
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database, folder, radar]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
        folder: {type: string, minLength: 1}
        radar: {type: string, minLength: 1}
        merge_midnight: {type: boolean, default: true}
  - code: valida_battute
    name: 04 test timeout
    handler_class: ScriptManager::Command::ValidaBattute
    execution_mode: async
    timeout_seconds: 1
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
  - code: rettifica_quote
    name: 08 test timeout
    handler_class: ScriptManager::Command::RettificaQuote
    execution_mode: async
    timeout_seconds: 1
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
  - code: correggi_quote
    name: 10 test timeout
    handler_class: ScriptManager::Command::CorreggiQuote
    execution_mode: async
    timeout_seconds: 1
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
  - code: carica_eventi_cmp
    name: 12-carica_eventi_cmp
    handler_class: ScriptManager::Command::CaricaEventiCMP
    execution_mode: async
    timeout_seconds: 3600
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database, airport, files, hashes, stations]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
        airport: {type: string, enum: [LIMC, LIML, LIME, LIPO]}
        files: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
        hashes: {type: array, minItems: 1, items: {type: string, pattern: '^[a-f0-9]{64}$'}}
        stations: {type: array, minItems: 1, items: {type: string, pattern: '^[1-9][0-9]*:[0-9]+$'}}
  - code: correla_eventi_cmp
    name: 14 test correlazione
    handler_class: ScriptManager::Command::CorrelaEventiCMP
    execution_mode: async
    timeout_seconds: 3600
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database, airport, date_from, date_to, stations, confirm_parameters, confirm_replacement]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
        airport: {type: string, enum: [LIMC, LIML, LIME, LIPO]}
        date_from: {type: string, format: date}
        date_to: {type: string, format: date}
        stations:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]*:[0-9]+:-?[0-9]+:-?[0-9]+:-?[0-9]+:[0-9]+(\.[0-9]+)?$'}
        confirm_parameters: {type: boolean, enum: [true]}
        confirm_replacement: {type: boolean, enum: [true]}
  - code: attualizza_correlazione_cmp
    name: 14 test attualizzazione
    ui_hidden: true
    handler_class: ScriptManager::Command::AttualizzaCorrelazione
    execution_mode: async
    timeout_seconds: 3600
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database, airport, source_execution_id, activations, confirm_activation]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
        airport: {type: string, enum: [LIMC, LIML, LIME, LIPO]}
        source_execution_id: {type: string, pattern: '^[0-9a-fA-F-]{36}$'}
        activations:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]*:[0-9]+(:(lva|lvan))?$'}
        confirm_activation: {type: boolean, enum: [true]}
  - code: elimina_correlazione_cmp
    name: 14 test eliminazione
    ui_hidden: true
    handler_class: ScriptManager::Command::EliminaCorrelazione
    execution_mode: async
    timeout_seconds: 3600
    queue_by_database: true
    parameter_schema:
      type: object
      required: [database, airport, day, station_id, station_code, snapshot, confirm_deletion]
      properties:
        database: {type: string, pattern: '^[A-Za-z0-9_]{1,64}$'}
        airport: {type: string, enum: [LIMC, LIML, LIME, LIPO]}
        day: {type: string, format: date}
        station_id: {type: string, pattern: '^[1-9][0-9]{0,9}$'}
        station_code: {type: string, pattern: '^[0-9]{1,10}$'}
        snapshot: {type: string, pattern: '^[0-9a-f]{64}$'}
        confirm_deletion: {type: boolean, enum: [true]}
