name: perl-script-manager

x-app-env: &app-env
  DATABASE_URL: postgresql://${APP_POSTGRES_USER:?impostare APP_POSTGRES_USER in .env}:${APP_POSTGRES_PASSWORD:?impostare APP_POSTGRES_PASSWORD in .env}@database:5432/${APP_POSTGRES_DB:-${POSTGRES_DB}}
  SCRIPT_MANAGER_DATABASE_SCHEMA: script_manager
  SCRIPT_MANAGER_SECRET: ${SCRIPT_MANAGER_SECRET:?impostare SCRIPT_MANAGER_SECRET in .env}
  SCRIPT_MANAGER_WORKER_JOBS: ${SCRIPT_MANAGER_WORKER_JOBS:-2}
  SCRIPT_MANAGER_DEBUG_OPERATIONS: ${SCRIPT_MANAGER_DEBUG_OPERATIONS:-0}
  FILE_OUT_ROOT: ${FILE_OUT_ROOT:-E:\FILE_OUT}
  MYSQL_HOST: ${MYSQL_HOST:-}
  MYSQL_PORT: ${MYSQL_PORT:-3306}
  MYSQL_USER: ${MYSQL_USER:-}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
  MRT_CONFIG_FILE: /app/config/local/MRT.json
  SCRIPT_MANAGER_OUT_ROOT: /app/var/input
  TZ: Europe/Rome

x-production-app: &production-app
  image: ${APP_IMAGE:-docker.io/mauromussin/perl-script-manager:latest}
  build:
    context: .
    target: production
  environment: *app-env
  volumes:
    - app_data:/app/var
    - type: bind
      source: ${FILE_OUT_ROOT:-E:\FILE_OUT}
      target: /app/var/input
      read_only: true
      bind:
        create_host_path: false
    - ./config/local:/app/config/local:ro
  depends_on:
    database:
      condition: service_healthy

services:
  database:
    image: postgis/postgis:16-3.4
    pull_policy: never
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:?impostare APP_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?impostare APP_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${APP_POSTGRES_DB:-${POSTGRES_DB}}
    volumes:
      - app_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/app-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${APP_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *production-app
    ports:
      - "127.0.0.1:3080:3000"

  worker:
    <<: *production-app
    command: perl bin/worker

  dev:
    image: perl-script-manager:dev
    build:
      context: .
      target: dev
    profiles: ["development"]
    environment:
      <<: *app-env
      MOJO_MODE: development
    volumes:
      - .:/app
      - type: bind
        source: ${FILE_OUT_ROOT:-E:\FILE_OUT}
        target: /app/var/input
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
    command: morbo -l http://*:3000 -w lib -w templates -w config bin/app
    ports:
      - "127.0.0.1:3001:3000"

  dev-worker:
    image: perl-script-manager:dev
    build:
      context: .
      target: dev
    profiles: ["development"]
    environment:
      <<: *app-env
      MOJO_MODE: development
    volumes:
      - .:/app
      - type: bind
        source: ${FILE_OUT_ROOT:-E:\FILE_OUT}
        target: /app/var/input
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
    command: perl bin/worker

  test:
    image: perl-script-manager:test
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      TEST_ONLINE: postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@database:5432/${APP_POSTGRES_DB:-${POSTGRES_DB}}
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
    command: prove -lr t

volumes:
  app_pgdata:
  app_data:
