# Catalogo delle procedure ammesse. Solo le procedure elencate qui sono eseguibili.
# handler_class deve trovarsi sotto ScriptManager::Command::.
# Parametri con "x-sensitive: true" non vengono salvati e richiedono execution_mode: sync.
procedures:
  - code: carica_db
    name: 02-carica_DB
    description: >-
      Carica i file OUT in MySQL. Scegli radar/revisione, unione a mezzanotte,
      database e sottocartella. Il codice ICAO nel nome identifica l'aeroporto;
      credenziali e host sono configurati sul server. I duplicati annullano il caricamento.
    enabled: true
    handler_class: ScriptManager::Command::CaricaDB
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema_file: 02-carica-variants.yml
  - code: valida_tracce
    name: 03-valida_tracce
    description: >-
      Valida le tracce (flay) nel database verificando che abbiano almeno 4 battute
      e almeno una battuta entro 10 km dal centro dell'aeroporto e 1000 m di quota.
      Tracce valide ricevono validation_fl='Y'; non valide ricevono validation_fl='N'
      e tutte le loro battute sono marcate con validation='A'.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi (azzera anche i risultati dipendenti).
    enabled: true
    handler_class: ScriptManager::Command::ValidaTracce
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema_file: 03-valida-tracce-schema.yml
  - code: valida_battute
    name: 04-valida_battute
    description: >-
      Valida le battute delle tracce gia validate da 03 (validation_fl Y e
      validation_bt NULL): taxi, spezzature, velocita e direzione.
      Aggiorna gli stati delle tracce e le date di decollo/atterraggio mancanti.
      Scritture in AutoCommit: annullamenti ed errori non annullano gli aggiornamenti gia eseguiti.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi (azzera anche pista e SID).
    enabled: true
    handler_class: ScriptManager::Command::ValidaBattute
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database]
      properties:
        database:
          type: string
          title: Database MySQL di destinazione
          pattern: '^[A-Za-z0-9_]{1,64}$'
          maxLength: 64
          x-order: 1
  - code: trova_pista_atterraggi
    name: 05-trova_pista_atterraggi
    description: >-
      Assegna pista e SID agli atterraggi validati da 04 con pista non ancora assegnata.
      Seleziona aeroporto e revisione legacy. Le assegnazioni fallite invalidano la traccia.
      AutoCommit: errori e annullamenti non annullano le scritture gia eseguite.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi.
    enabled: true
    handler_class: ScriptManager::Command::TrovaPistaAtterraggi
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: &runway_database
          type: string
          title: Database MySQL di destinazione
          pattern: '^[A-Za-z0-9_]{1,64}$'
          maxLength: 64
          x-order: 1
        airport: &runway_airport
          type: string
          title: Aeroporto
          enum: [LIMC, LIML, LIME, LIPO]
          x-enum-labels:
            LIMC: Milano Malpensa
            LIML: Milano Linate (pista principale)
            LIME: Bergamo Orio al Serio
            LIPO: Brescia Montichiari
          x-order: 2
        revision:
          type: string
          title: Revisione legacy atterraggi
          enum: ['1.0', '1.1', '1.2']
          default: '1.2'
          x-enum-labels:
            '1.0': '1.0 - senza Montichiari, Orio offset -376 m'
            '1.1': '1.1 - con Montichiari, Orio offset -376 m'
            '1.2': '1.2 - con Montichiari, Orio senza offset'
          x-order: 3
  - code: trova_pista_decolli
    name: 06-trova_pista_decolli
    description: >-
      Assegna la pista ai decolli validati da 04 con pista non ancora assegnata (legacy 1.1).
      Non assegna la SID. Le assegnazioni fallite invalidano la traccia.
      AutoCommit: errori e annullamenti non annullano le scritture gia eseguite.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi (azzera anche la SID dipendente).
    enabled: true
    handler_class: ScriptManager::Command::TrovaPistaDecolli
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: *runway_database
        airport: *runway_airport
  - code: example_echo
    name: Esempio - eco con file di output
    description: >-
      Procedura dimostrativa: ripete un messaggio, ne mostra l'avanzamento
      e produce facoltativamente un file di testo scaricabile.
    enabled: true
    handler_class: ScriptManager::Command::Example
    execution_mode: async
    timeout_seconds: 60
    exclusive: false
    retention_days: 7
    parameter_schema:
      type: object
      required: [message]
      properties:
        message:
          type: string
          title: Messaggio
          minLength: 1
          maxLength: 200
          x-order: 1
        repeat:
          type: integer
          title: Ripetizioni
          minimum: 1
          maximum: 10
          default: 3
          x-order: 2
        delay_seconds:
          type: number
          title: Pausa tra i passaggi (secondi)
          minimum: 0
          maximum: 5
          default: 0.5
          x-order: 3
        case:
          type: string
          title: Maiuscole/minuscole
          enum: [unchanged, upper, lower]
          default: unchanged
          x-order: 4
        write_file:
          type: boolean
          title: Produci file di output
          default: true
          x-order: 5
