# Catalogo delle procedure ammesse. Solo le procedure elencate qui sono eseguibili.
# handler_class deve trovarsi sotto ScriptManager::Command::.
# Parametri con "x-sensitive: true" non vengono salvati e richiedono execution_mode: sync.
procedures:
  - code: carica_db
    name: 02-carica_DB
    description: >-
      Carica i file OUT in MySQL. Scegli radar/revisione, unione a mezzanotte,
      database e sottocartella. Il codice ICAO nel nome identifica l'aeroporto;
      credenziali e host sono configurati sul server. I duplicati annullano il caricamento.
      Prima dell'avvio e possibile confermare la disattivazione del timeout per la sola richiesta.
      Dopo un timeout e possibile confermare una riesecuzione senza limite, verificando prima
      il recupero e lo stato dei dati: la riesecuzione non e idempotente.
    enabled: true
    handler_class: ScriptManager::Command::CaricaDB
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema_file: 02-carica-variants.yml
  - code: valida_tracce
    name: 03-valida_tracce
    description: >-
      Valida le tracce (flay) nel database verificando che abbiano almeno 4 battute
      e almeno una battuta entro 10 km dal centro dell'aeroporto e 1000 m di quota.
      Tracce valide ricevono validation_fl='Y'; non valide ricevono validation_fl='N'
      e tutte le loro battute sono marcate con validation='A'.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi (azzera anche i risultati dipendenti).
    enabled: true
    handler_class: ScriptManager::Command::ValidaTracce
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema_file: 03-valida-tracce-schema.yml
  - code: valida_battute
    name: 04-valida_battute
    description: >-
      Valida le battute delle tracce gia validate da 03 (validation_fl Y e
      validation_bt NULL): taxi, spezzature, velocita e direzione.
      Aggiorna gli stati delle tracce e le date di decollo/atterraggio mancanti.
      Scritture in AutoCommit: annullamenti ed errori non annullano gli aggiornamenti gia eseguiti.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi (azzera anche pista e SID).
      Prima delle scritture stima la durata: oltre il timeout propone una riesecuzione senza limite
      con conferma esplicita nel dettaglio; storico non misurabile resta bloccante.
    enabled: true
    handler_class: ScriptManager::Command::ValidaBattute
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database]
      properties:
        database:
          type: string
          title: Database MySQL di destinazione
          pattern: '^[A-Za-z0-9_]{1,64}$'
          maxLength: 64
          x-order: 1
  - code: trova_pista_atterraggi
    name: 05-trova_pista_atterraggi
    description: >-
      Assegna pista e SID agli atterraggi validati da 04 con pista non ancora assegnata.
      Seleziona aeroporto e revisione legacy. Le assegnazioni fallite invalidano la traccia.
      AutoCommit: errori e annullamenti non annullano le scritture gia eseguite.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi.
    enabled: true
    handler_class: ScriptManager::Command::TrovaPistaAtterraggi
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: &runway_database
          type: string
          title: Database MySQL di destinazione
          pattern: '^[A-Za-z0-9_]{1,64}$'
          maxLength: 64
          x-order: 1
        airport: &runway_airport
          type: string
          title: Aeroporto
          enum: [LIMC, LIML, LIME, LIPO]
          x-enum-labels:
            LIMC: Milano Malpensa
            LIML: Milano Linate (pista principale)
            LIME: Bergamo Orio al Serio
            LIPO: Brescia Montichiari
          x-order: 2
        revision:
          type: string
          title: Revisione legacy atterraggi
          enum: ['1.0', '1.1', '1.2']
          default: '1.2'
          x-enum-labels:
            '1.0': '1.0 - senza Montichiari, Orio offset -376 m'
            '1.1': '1.1 - con Montichiari, Orio offset -376 m'
            '1.2': '1.2 - con Montichiari, Orio senza offset'
          x-order: 3
  - code: trova_pista_decolli
    name: 06-trova_pista_decolli
    description: >-
      Assegna la pista ai decolli validati da 04 con pista non ancora assegnata (legacy 1.1).
      Non assegna la SID. Le assegnazioni fallite invalidano la traccia.
      AutoCommit: errori e annullamenti non annullano le scritture gia eseguite.
      Date facoltative: senza intervallo considera tutto il database.
      Salta i giorni gia completati, salvo Sovrascrivi (azzera anche la SID dipendente).
    enabled: true
    handler_class: ScriptManager::Command::TrovaPistaDecolli
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: *runway_database
        airport: *runway_airport
  - code: assegna_sid
    name: 07-assegna_sid
    description: >-
      Assegna le SID ai decolli con pista, secondo la revisione 2.2 dal_2015_corr.
      Intervallo su data_ora_arr: senza date considera tutti i giorni.
      Salta i giorni gia completati salvo Sovrascrivi, che ricalcola solo le SID.
      AutoCommit: errori e annullamenti non annullano le scritture gia eseguite.
    enabled: true
    handler_class: ScriptManager::Command::AssegnaSID
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: *runway_database
        airport:
          type: string
          title: Aeroporto
          enum: [LIMC, LIML, LIME]
          x-enum-labels:
            LIMC: Milano Malpensa
            LIML: Milano Linate (pista principale)
            LIME: Bergamo Orio al Serio
          x-order: 2
  - code: rettifica_quote
    name: 08-rettifica_quote_nulle
    description: >-
      Rettifica le quote zero di arrivi e decolli con validation_bt=1 e pista assegnata.
      Scrive Z_m e hmod senza alterare H_m; copia anche le quote originali non nulle.
      Date facoltative su data_ora_italy; salta i giorni gia completati salvo Sovrascrivi.
      AutoCommit: errori e annullamenti non annullano le scritture gia eseguite.
      La stima preventiva puo richiedere conferma esplicita per continuare senza timeout.
    enabled: true
    handler_class: ScriptManager::Command::RettificaQuote
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database]
      properties:
        database: *runway_database
  - code: carica_meteo
    name: 09-carica_dati_meteo
    description: >-
      Recupera dati storici orari Open-Meteo alle coordinate e quota ARP dell'aeroporto.
      Scrive meteo in ora italiana: dati modellistici, non misure di centralina.
      Date obbligatorie. Salta giorni con dati esistenti; Sovrascrivi sostituisce
      interi giorni, anche misure di centraline. Ora ripetuta: conserva la seconda.
      Report scaricabile con sorgente e dati UTC originali. AutoCommit senza rollback.
      La fase 10 integrata usa la provenienza e la quota ARP salvate da questo comando.
      Chiamate API e budget residuo locale sono tracciati in log, riepilogo e report.
      Dopo una sostituzione del meteo, ricalcolare 10 con Sovrascrivi.
    enabled: true
    handler_class: ScriptManager::Command::CaricaMeteo
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: *runway_database
        airport: *runway_airport
  - code: correggi_quote
    name: 10-correggi_quote
    description: >-
      Normalizza Z_m in A_m con pressione e temperatura orarie Open-Meteo alla quota ARP.
      Usa l'ora contenente data_ora_arr e solo giornate importate da 09 con provenienza verificata.
      Salta con avviso le tracce senza meteo valido. Nessuna chiamata API.
      Letture per gruppi di tracce e aggiornamenti a lotti; stima del salvataggio e conferma per
      rieseguire senza timeout se manca una misura o la durata supera il limite.
      Date facoltative; Sovrascrivi ricalcola anche lo stato 3. AutoCommit senza rollback.
    enabled: true
    handler_class: ScriptManager::Command::CorreggiQuote
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport]
      properties:
        database: *runway_database
        airport: *runway_airport
  - code: carica_eventi_cmp
    name: 12-carica_eventi_cmp
    description: >-
      Importa tutti i file TXT dalla cartella configurata, associando ogni file
      a una stazione scelta dall'utente. Le date dei TXT sono in ora italiana.
      I duplicati per codice stazione, data, durata e Leq vengono ignorati.
      AutoCommit: errori e annullamenti possono lasciare scritture parziali.
    enabled: true
    handler_class: ScriptManager::Command::CaricaEventiCMP
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport, files, hashes, stations]
      properties:
        database: *runway_database
        airport: *runway_airport
        files:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, minLength: 1}
        hashes:
          type: array
          minItems: 1
          items: {type: string, pattern: '^[a-f0-9]{64}$'}
        stations:
          type: array
          minItems: 1
          items: {type: string, pattern: '^[1-9][0-9]*:[0-9]+$'}
  - code: correla_eventi_cmp
    name: 14-correla_eventi_cmp
    description: >-
      Correla gli eventi acustici alle battute e calcola LVA e LVAn.
      La sostituzione elimina le correlazioni esistenti della stazione nel periodo,
      per tutti gli shift. MyISAM non garantisce rollback in caso di interruzione.
    enabled: true
    handler_class: ScriptManager::Command::CorrelaEventiCMP
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    retention_days: 7
    parameter_schema:
      type: object
      required: [database, airport, date_from, date_to, stations, confirm_parameters, confirm_replacement]
      properties:
        database: *runway_database
        airport: *runway_airport
        date_from: {type: string, format: date}
        date_to: {type: string, format: date}
        stations:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]*:[0-9]+:-?[0-9]+:-?[0-9]+:-?[0-9]+:[0-9]+(\.[0-9]+)?$'}
        confirm_parameters: {type: boolean, enum: [true]}
        confirm_replacement: {type: boolean, enum: [true]}
  - code: attualizza_correlazione_cmp
    name: 14-attualizza risultati LVA e LVAn
    ui_hidden: true
    description: >-
      Attualizza i risultati selezionati dopo la verifica della correlazione.
      Con MyISAM le interruzioni possono lasciare modifiche parziali.
    enabled: true
    handler_class: ScriptManager::Command::AttualizzaCorrelazione
    queue_by_database: true
    execution_mode: async
    timeout_seconds: 3600
    exclusive: true
    parameter_schema:
      type: object
      required: [database, airport, source_execution_id, activations, confirm_activation]
      properties:
        database: *runway_database
        airport: *runway_airport
        source_execution_id: {type: string, pattern: '^[0-9a-fA-F-]{36}$'}
        activations:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, pattern: '^[1-9][0-9]*:[0-9]+:(lva|lvan)$'}
        confirm_activation: {type: boolean, enum: [true]}
  - code: example_echo
    name: Esempio - eco con file di output
    description: >-
      Procedura dimostrativa: ripete un messaggio, ne mostra l'avanzamento
      e produce facoltativamente un file di testo scaricabile.
    enabled: true
    handler_class: ScriptManager::Command::Example
    execution_mode: async
    timeout_seconds: 60
    exclusive: false
    retention_days: 7
    parameter_schema:
      type: object
      required: [message]
      properties:
        message:
          type: string
          title: Messaggio
          minLength: 1
          maxLength: 200
          x-order: 1
        repeat:
          type: integer
          title: Ripetizioni
          minimum: 1
          maximum: 10
          default: 3
          x-order: 2
        delay_seconds:
          type: number
          title: Pausa tra i passaggi (secondi)
          minimum: 0
          maximum: 5
          default: 0.5
          x-order: 3
        case:
          type: string
          title: Maiuscole/minuscole
          enum: [unchanged, upper, lower]
          default: unchanged
          x-order: 4
        write_file:
          type: boolean
          title: Produci file di output
          default: true
          x-order: 5
