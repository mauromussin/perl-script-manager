name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Check Docker Hub credentials
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Configure the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets."
            exit 1
          fi

      - name: Build production image
        run: docker build --platform linux/amd64 --target production --tag perl-script-manager:ci .

      - name: Check production entry points
        run: |
          docker run --rm --entrypoint perl perl-script-manager:ci -Ilib -c bin/app
          docker run --rm --entrypoint perl perl-script-manager:ci -Ilib -c bin/worker
          docker run --rm --entrypoint perl perl-script-manager:ci -Ilib -c bin/procedure

      - name: Export production image for offline deployment
        run: sh docker/export-image.sh

      - name: Upload offline production image
        uses: actions/upload-artifact@v4
        with:
          name: perl-script-manager-linux-amd64-${{ github.sha }}
          path: |
            image-artifact/perl-script-manager.tar
            image-artifact/perl-script-manager.tar.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Publish production image
        if: github.event_name == 'push'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          image="docker.io/mauromussin/perl-script-manager"
          tags=("sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=("latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("$GITHUB_REF_NAME")
          fi
          for tag in "${tags[@]}"; do
            docker tag perl-script-manager:ci "$image:$tag"
            docker push "$image:$tag"
          done
