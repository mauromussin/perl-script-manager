name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: dev-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-dev
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - id: prod-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      # Build once and load locally to run the tests and extract cpanfile.snapshot.
      - name: Build dev image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          load: true
          tags: perl-script-manager-dev:ci
          cache-from: type=gha,scope=dev
          cache-to: type=gha,scope=dev,mode=max

      - name: Extract cpanfile.snapshot
        run: docker run --rm perl-script-manager-dev:ci cat /app/cpanfile.snapshot > cpanfile.snapshot.generated

      - uses: actions/upload-artifact@v4
        with:
          name: cpanfile.snapshot
          path: cpanfile.snapshot.generated

      - name: Run tests in the image
        run: |
          docker network create sm-test
          docker run -d --name sm-db --network sm-test \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test \
            --health-cmd "pg_isready -U test" --health-interval 3s --health-retries 20 \
            postgres:16-bookworm
          until [ "$(docker inspect -f '{{.State.Health.Status}}' sm-db)" = healthy ]; do sleep 2; done
          docker run --rm --network sm-test \
            -e TEST_ONLINE=postgresql://test:test@sm-db:5432/test \
            -v "$PWD":/app perl-script-manager-dev:ci \
            carton exec prove -lr t

      - name: Push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: true
          tags: ${{ steps.dev-meta.outputs.tags }}
          labels: ${{ steps.dev-meta.outputs.labels }}
          cache-from: type=gha,scope=dev

      # The production target needs a committed cpanfile.snapshot (carton install --deployment).
      - name: Check for cpanfile.snapshot
        id: snapshot
        run: |
          if [ -f cpanfile.snapshot ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - name: Push production image
        if: steps.snapshot.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ${{ steps.prod-meta.outputs.tags }}
          labels: ${{ steps.prod-meta.outputs.labels }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,scope=production,mode=max
