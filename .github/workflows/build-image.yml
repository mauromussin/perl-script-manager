name: build-image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  production-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build production image
        run: docker build --target production --tag perl-script-manager:ci .

      - name: Check production entry points
        run: |
          docker run --rm --entrypoint perl perl-script-manager:ci -Ilib -c bin/app
          docker run --rm --entrypoint perl perl-script-manager:ci -Ilib -c bin/worker
          docker run --rm --entrypoint perl perl-script-manager:ci -Ilib -c bin/procedure

      - name: Publish production image
        if: github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=("sha-${GITHUB_SHA::7}")
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags+=("latest")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=("$GITHUB_REF_NAME")
          fi
          for tag in "${tags[@]}"; do
            docker tag perl-script-manager:ci "$image:$tag"
            docker push "$image:$tag"
          done
